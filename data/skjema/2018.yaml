# Spørreskjemaet for 2018: spørsmålene som er dokumentert i denne versjonen.
#
# Ordlyden er skrevet av fra spørreskjemaet, tegn for tegn, med skrivemåten i kilden.
# Svaralternativene står i skjemaets rekkefølge. `kode` er koden som står trykt eller
# programmert i skjemaet (null = ingen kode i skjemaet). `datafil` er variabelen og
# kodingen i leverandørens datafil for utgaven.

formatversjon: 1
utgave: "2018"
sporreskjema: rapport-2018

sporsmal:
  - konsept: trives_oslo
    skjema_nr: "1"
    ledd_nr: "1"
    seksjon: "Først noen spørsmål om hvordan det er å bo i Oslo."
    innledning: "I hvilken grad:"
    instruksjon: "Merk: Sett ett kryss på hver linje"
    ledd_tekst: "Trives du i Oslo?"
    svartype: skala
    svaralternativer:
      - {kode: 1, tekst: "I svært liten grad"}
      - {kode: 2, tekst: null}
      - {kode: 3, tekst: null}
      - {kode: 4, tekst: null}
      - {kode: 5, tekst: null}
      - {kode: 6, tekst: "I svært stor grad"}
      - {kode: null, tekst: "Ikke sikker"}
    filter: null
    kilde: {id: rapport-2018, side: "114"}
    merknad: Datafila følger nummereringen i nettskjemaet (Q001), ikke papirskjemaet (1).
    datafil:
      variabel: "Q001__1"
      koder: [1, 2, 3, 4, 5, 6]
      ikke_sikker_kode: 7
      manglende: [8]
      merknad: >-
        Kodene 7 (Ikke sikker) og 8 (na) er deklarert som brukerdefinerte manglende verdier i
        datafila. Programmer som ikke leser slike deklarasjoner, viser begge som tomme, og da
        forsvinner «Ikke sikker».
      kontrollert: true
      kilde: {id: datafil, side: null}
    varianter:
      - navn: nettskjema
        beskrivelse: Versjonen for dem som svarte på nett.
        skjema_nr: "Q001"
        ledd_nr: "1"
        seksjon: "Først noen spørsmål om hvordan det er å bo i Oslo"
        innledning: "I hvilken grad:"
        ledd_tekst: "Trives du i Oslo?"
        svartype: skala
        svaralternativer:
          - {kode: 1, tekst: "I svært liten grad"}
          - {kode: 2, tekst: null}
          - {kode: 3, tekst: null}
          - {kode: 4, tekst: null}
          - {kode: 5, tekst: null}
          - {kode: 6, tekst: "I svært stor grad"}
          - {kode: null, tekst: "Ikke sikker"}
        kilde: {id: nettskjema-2018, side: null}
