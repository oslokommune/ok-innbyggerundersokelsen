      - "For hvert av forholdene ber vi deg svare langs en skala fra 1 til 6, der 1 betyr at du er svært misfornøyd med dette forholdet, og 6 betyr at du er svært fornøyd."
    ledd_tekst: "Trygghet når det gjelder å ferdes ute på kveldstid"
    svartype: skala
    svaralternativer:
