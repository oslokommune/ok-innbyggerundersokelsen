# Spørreskjemaet for 2010: spørsmålene som er dokumentert i denne versjonen.
#
# Ordlyden er skrevet av fra spørreskjemaet, tegn for tegn, med skrivemåten i kilden.
# Svaralternativene står i skjemaets rekkefølge. `kode` er koden som står trykt eller
# programmert i skjemaet (null = ingen kode i skjemaet). `datafil` er variabelen og
# kodingen i leverandørens datafil for utgaven.

formatversjon: 1
utgave: "2010"
sporreskjema: skjema-2010

sporsmal:
  - konsept: trives_oslo
    skjema_nr: "12"
    ledd_nr: "1"
    seksjon: "OSLO SOM BY Å BO I"
    innledning: "Først vil vi stille noen spørsmål knyttet til din vurdering av OSLO SOM BY Å BO I. I hvilken grad..."
    instruksjon: "Merk: Sett ett kryss på hver linje"
    ledd_tekst: "Trives du i Oslo?"
    svartype: skala
    svaralternativer:
      - {kode: 1, tekst: "I svært liten grad"}
      - {kode: 2, tekst: null}
      - {kode: 3, tekst: null}
      - {kode: 4, tekst: null}
      - {kode: 5, tekst: null}
      - {kode: 6, tekst: "I svært stor grad"}
      - {kode: null, tekst: "Ikke sikker"}
    filter: null
    kilde: {id: skjema-2010, side: "2"}
    merknad: null
    datafil:
      variabel: "Q12_1"
      koder: [1, 2, 3, 4, 5, 6]
      ikke_sikker_kode: 7
      manglende: tom
      merknad: >-
        2007 og 2010 ligger i én felles datafil. Kodene 7 (Ikke sikker) og 8 (Ubesvart) har
        etikett i fila, men forekommer ikke. Svar uten gyldig verdi er tomme, så «Ikke sikker»
        kan ikke skilles fra ubesvart.
      kontrollert: true
      kilde: {id: datafil, side: null}
  - konsept: trygghet_kveld_der_du_bor
    skjema_nr: "19"
    ledd_nr: "6"
    seksjon: "TRYGGHET OG KRIMINALITET"
    innledning:
      - "Hvor fornøyd eller misfornøyd er du med. . ."
      - "....der du bor"
    instruksjon: null
    ledd_tekst: "Trygghet når det gjelder å ferdes ute på kveldstid"
    svartype: skala
    svaralternativer:
      - {kode: 1, tekst: "Svært misfornøyd"}
      - {kode: 2, tekst: null}
      - {kode: 3, tekst: null}
      - {kode: 4, tekst: null}
      - {kode: 5, tekst: null}
      - {kode: 6, tekst: "Svært fornøyd"}
      - {kode: null, tekst: "Ikke sikker"}
    filter: null
    kilde: {id: skjema-2010, side: "5"}
    merknad: null
    datafil:
      variabel: "Q19_6"
      koder: [1, 2, 3, 4, 5, 6]
      ikke_sikker_kode: 7
      manglende: tom
      merknad: >-
        2007 og 2010 ligger i én felles datafil. Kodene 7 (Ikke sikker) og 8 (Ubesvart) har
        etikett i fila, men forekommer ikke. Svar uten gyldig verdi er tomme, så «Ikke sikker»
        kan ikke skilles fra ubesvart.
      kontrollert: true
      kilde: {id: datafil, side: null}
  - konsept: trygghet_dag_der_du_bor
    skjema_nr: "19"
    ledd_nr: "5"
    seksjon: "TRYGGHET OG KRIMINALITET"
    innledning:
