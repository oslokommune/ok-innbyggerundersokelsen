      - {kode: 3, tekst: null}
      - {kode: 4, tekst: null}
      - {kode: 5, tekst: null}
      - {kode: 6, tekst: "Svært fornøyd"}
      - {kode: null, tekst: "Ikke sikker"}
    filter: null
    kilde: {id: skjema-2010, side: "5"}
    merknad: null
    datafil:
      variabel: "Q19_5"
      koder: [1, 2, 3, 4, 5, 6]
      ikke_sikker_kode: 7
      manglende: tom
      merknad: >-
        2007 og 2010 ligger i én felles datafil. Kodene 7 (Ikke sikker) og 8 (Ubesvart) har
        etikett i fila. Svar uten gyldig verdi er tomme. Variabelen er plassert etter rekkefølgen i skjemaet,
        der blokken «der du bor» står etter blokken «i Oslo sentrum», og plasseringen er
        bekreftet mot andelen som er publisert i rapporten for 2007.
      kontrollert: true
      kilde: {id: datafil, side: null}
