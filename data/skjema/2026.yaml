    ledd_tekst: "Trygghet når det gjelder å ferdes ute på kveldstid der du bor"
    svartype: skala
    svaralternativer:
      - {kode: 1, tekst: "1 - Svært misfornøyd"}
      - {kode: 2, tekst: null}
      - {kode: 3, tekst: null}
      - {kode: 4, tekst: null}
      - {kode: 5, tekst: null}
      - {kode: 6, tekst: "6 - Svært fornøyd"}
      - {kode: 98, tekst: "Ikke sikker"}
    filter: null
    kilde: {id: metoderapport-2026, side: "20"}
    merknad: null
    datafil:
      variabel: "Q004r4"
      koder: [1, 2, 3, 4, 5, 6]
      ikke_sikker_kode: 98
