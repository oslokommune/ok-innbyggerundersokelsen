      undersøkelsen bare på nett, og kontaktinformasjonen kom fra Kontakt- og reservasjonsregisteret.
      Populasjonen er likevel ikke den samme: i 2023 var innvandrere med under fem års botid ikke
      med i utvalget, i 2026 var de med. Endringen gjelder alle spørsmål og vises derfor her.
      Svarprosenten i 2026 er regnet på en annen måte, men det endrer ikke hvem som svarte.
    grunnlag:
      - {id: rapport-2023, side: "4, 7, 12"}
      - {id: metoderapport-2026, side: "1–4, 7, 20"}
      - {id: fin-utvalg-2026, side: null}
    besluttet_av: FIN
    dato: 2026-09-23

