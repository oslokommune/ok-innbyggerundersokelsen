  # --- natur_friluft_der_du_bor --------------------------------------------------------
  - konsept: natur_friluft_der_du_bor
    fra_utgave: "2007"
    til_utgave: "2010"
    sammenlignbar: med_forbehold
    begrunnelse: >-
      Linjeteksten og skalaen er de samme, og spørsmålet står i det samme batteriet om bydelen
      og området der man bor. Målgruppen ble utvidet fra 15–80 år til 15 år og eldre. Endringen
      gjelder alle spørsmål og vises derfor også her. Feltarbeidet var om høsten begge år.
    grunnlag:
      - {id: skjema-2007, side: "3"}
      - {id: skjema-2010, side: "3"}
      - {id: rapport-2007, side: "3"}
      - {id: rapport-2010, side: "4"}
    besluttet_av: FIN
    dato: 2026-09-30

  - konsept: natur_friluft_der_du_bor
    fra_utgave: "2010"
    til_utgave: "2014"
    sammenlignbar: med_forbehold
    begrunnelse: >-
      Linjeteksten ble endret fra «… i bydelen» til «… i bydelen der du bor», og overskriften
      på batteriet nevner ikke lenger bydelen, bare området der man bor. Meningen er den samme,
      med et presisert sted. Målgruppen ble endret fra 15 år og eldre til 18 år og eldre, så
      populasjonen er ikke den samme. Feltarbeidet flyttet fra høst til vinter.
    grunnlag:
      - {id: skjema-2010, side: "3"}
      - {id: rapport-2010, side: "4"}
      - {id: rapport-2014, side: "3, 62"}
    besluttet_av: FIN
    dato: 2026-09-30

  - konsept: natur_friluft_der_du_bor
    fra_utgave: "2014"
    til_utgave: "2018"
    sammenlignbar: med_forbehold
    begrunnelse: >-
      Linjeteksten ble endret fra «… i bydelen der du bor» til «… der du bor». Spørsmålet står
      rett etter spørsmålene om trivsel begge år; nummeret endret seg fordi bakgrunnsspørsmålene
      ble flyttet til slutten av skjemaet, og i papirskjemaet falt overskriften om området der du
      bor, bort. «Der du bor» uten «i bydelen» kan leses som et litt annet område, men rapporten
      for 2018 sammenligner selv med 2014 og behandler det som samme spørsmål. Feltarbeidet
      flyttet fra vinter til vår.
    grunnlag:
      - {id: rapport-2014, side: "3, 62"}
      - {id: rapport-2018, side: "5, 31, 114, 118"}
      - {id: nettskjema-2018, side: null}
    besluttet_av: FIN
    dato: 2026-09-30

  - konsept: natur_friluft_der_du_bor
    fra_utgave: "2018"
    til_utgave: "2023"
    sammenlignbar: med_forbehold
    begrunnelse: >-
      Omleggingen i 2023, som for trivsel. Linjeteksten og skalaen er de samme, men spørsmålet
      ble flyttet til batteriet «Nå noen spørsmål om miljø», med et nytt ledd om tilgangen i
      Osloområdet generelt rett etter. Rapporten for 2023 viser ikke tidligere år i figuren for
      dette spørsmålet og begrunner det i en fotnote: «Spørsmålet ble stilt i en annen del av
      undersøkelsen og resultater fra foregående år vises derfor ikke i grafen.» I teksten
      sammenligner rapporten likevel med tidligere år. Rapporten sier også at det postale
      utvalget var mer fornøyd enn det digitale med tilgangen til natur- og friluftsområder der
      de bor (s. 21). Spørsmålet måler det samme, men flyttingen kan ha påvirket tallene.
      Feltarbeidet var om våren begge år.
    grunnlag:
      - {id: rapport-2023, side: "4, 7, 12, 18, 21, 47, 93"}
    besluttet_av: FIN
    dato: 2026-09-30

  - konsept: natur_friluft_der_du_bor
    fra_utgave: "2023"
    til_utgave: "2026"
    sammenlignbar: med_forbehold
    begrunnelse: >-
      Samme spørsmål og skala, og i hovedsak samme metode: begge år i hovedsak nettundersøkelse
      med invitasjon på e-post, utvalg og vekting etter landbakgrunn, feltarbeid om våren. I 2026 var
