# Konseptene: det et spørsmål måler, uavhengig av ordlyd og variabelnavn.
#
# Id-en beskriver det som måles og endres aldri. Endrer et spørsmål mening, får det en ny
# id. Deles eller slås et spørsmål sammen, føres det som en kobling mellom konseptene.
# Leverandørenes variabelnavn står per utgave i data/skjema/<utgave>.yaml.

formatversjon: 1

konsepter:
  - id: trives_oslo
    navn: Trivsel i Oslo
    beskrivelse: >-
      Hvor godt man trives i Oslo, på en skala fra 1 (i svært liten grad) til 6 (i svært stor
      grad).
    tema: Oslo som by å bo i
    koblinger: []
    note_til_tabell: >-
      Fra 2023 ble undersøkelsen lagt om: i hovedsak nettundersøkelse med invitasjon på e-post,
      og utvalget ble trukket og vektet etter landbakgrunn. Tall fra 2023 og senere bør
      sammenlignes med tidligere år med varsomhet. Mer om metode og sammenlignbarhet:
      https://github.com/oslokommune/ok-innbyggerundersokelsen

