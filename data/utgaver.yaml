      kilde: {id: rapport-2010, side: "8"}
    skjemaendring:
      beskrivelse: >-
        «med visse mindre modifikasjoner» en gjentakelse av skjemaet fra 2007.
      kilde: {id: rapport-2010, side: "4"}
