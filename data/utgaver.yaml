        nytt tiltak det året.
      kilde: {id: rapport-2007, side: "7"}
    feltperiode:
      fra: 2004-11-01
      til: null
      beskrivelse: Fra 1. november 2004 «og ut året».
      arstid: høst
      kilde: {id: rapport-2004, side: "3"}
    svar:
      bruttoutvalg: 14610
      nettoutvalg: 6297
      svarprosent: 45
      beregning: >-
        Ikke oppgitt. 637 skjemaer kom i retur på grunn av ukjent adresse. Regnet av utsendte
        minus retur blir svarprosenten 45,1.
      nettoutvalg_merknad: null
      kilde: {id: rapport-2004, side: "3"}
    vekting:
      variabler: [kjønn, alder, bydel]
