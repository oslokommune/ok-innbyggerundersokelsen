      kilde: {id: rapport-2018, side: "5, 114"}
      kilde_tillegg: {id: nettskjema-2018, side: null}
    sammenligner_med:
      utgaver: ["2007", "2010", "2014"]
      kilde: {id: rapport-2018, side: "10"}

  - id: "2023"
    aar: 2023
    navn: Innbyggerundersøkelsen
    sporreskjema: {id: rapport-2023, side: "87–105"}
    oppdrag:
      oppdragsgiver: Oslo kommune
      leverandor: Kantar Public
      kilde: {id: rapport-2023, side: "4"}
    malgruppe:
      beskrivelse: >-
        Innbyggere i Oslo, 18 år og eldre. Innvandrere med under fem års botid var ikke med i
        utvalget.
      alder_fra: 18
      alder_til: null
      kilde: {id: rapport-2023, side: "4, 7"}
    analyseenhet: Individual
    tidsmetode: CrossSection
    utvalgsramme:
      beskrivelse: >-
        Folkeregisteret, uttrekk ved TietoEvry. Personer som har reservert seg mot å bli
        kontaktet, ble tatt ut.
      kilde: {id: rapport-2023, side: "5, 8"}
    utvalgsdesign:
      type: Probability.Stratified.Disproportional
      beskrivelse: >-
        To utvalg, begge trukket disproporsjonalt etter landbakgrunn i hver bydel. Det digitale
        utvalget ble overtrukket direkte blant innvandrergrupper; planen var 52,8 prosent med
        bakgrunn fra Asia, Afrika, Latin-Amerika og Øst-Europa utenfor EU. Det postale utvalget
        på 4 500 ble trukket som i 2018, med overtrekk etter bydel, for å kunne sammenligne med
        2018.
      kilde: {id: rapport-2023, side: "4, 7"}
    innsamling:
      beskrivelse: >-
        Det digitale utvalget fikk invitasjon på e-post og svarte på nett. Det postale utvalget
        fikk skjemaet i posten, med mulighet for å svare på nett.
      modus:
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 27685, merknad: digitalt utvalg}
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 613, merknad: postalt utvalg}
        - {kode: SelfAdministeredQuestionnaire.Paper, antall: 553, merknad: postalt utvalg}
      merknad: >-
        Fordelingen i det postale utvalget er hentet fra tabell 2.21 (s. 20). Teksten på s. 11
        oppgir den motsatte fordelingen.
      kilde: {id: rapport-2023, side: "4, 20"}
    kontakt:
      beskrivelse: >-
        Digitalt utvalg: e-post 17. april, påminnelse på e-post 11. mai og på SMS 22. mai.
        Postalt utvalg: brev 25. april, påminnelse i brev 16. mai og på SMS 30. mai.
      kilde: {id: rapport-2023, side: "6"}
    sprak:
      beskrivelse: >-
        Digitalt utvalg: norsk, engelsk, polsk, urdu eller somali. Postalt utvalg: papirskjemaet
        på norsk, nettskjemaet på alle fem språk.
      kilde: {id: rapport-2023, side: "5–6, 12"}
    feltperiode:
      fra: 2023-04-17
      til: 2023-06-05
      beskrivelse: >-
        Digitalt utvalg 17. april–5. juni, postalt utvalg 25. april–1. juni. Undersøkelsen var
        planlagt til 2022, men ble utsatt på grunn av pandemien.
      arstid: vår
      kilde: {id: rapport-2023, side: "4–6"}
    svar:
      bruttoutvalg: 142260
      nettoutvalg: 28851
      svarprosent: null
      beregning: >-
        Oppgitt for hvert utvalg. Digitalt: 27 685 svar av 137 760 invitasjoner etter at
        reserverte var tatt ut, 20,1 prosent (s. 8). Postalt: 1 166 svar av 4 500 utsendte minus
        246 i retur, 27 prosent (s. 10–11).
      nettoutvalg_merknad: >-
        Bruttoutvalget er summen av 137 760 og 4 500. Rapporten oppgir også 137 777 utsendinger
        i det digitale utvalget (s. 4). Nettoutvalget er summen i tabell 2.21 (s. 20). Tabell
        2.20 oppgir 28 818 for det vektede utvalget (s. 19).
      kilde: {id: rapport-2023, side: "8, 10–11, 20"}
    vekting:
      variabler: [kjønn, alder, bydel, landbakgrunn]
      beskrivelse: >-
        Vektet etter kjønn, alder i fire grupper og landbakgrunn i hver bydel, og etter
        landbakgrunn i fire grupper.
      vektvariabel: {navn: NewWeight, kilde: {id: datafil, side: null}}
      kilde: {id: rapport-2023, side: "12"}
    landbakgrunn:
      type: register
      beskrivelse: Folkeregisteret.
      kilde: {id: rapport-2023, side: "6"}
    skjemaendring:
      beskrivelse: >-
        Hovedtyngden av spørsmålene ble beholdt, men noen spørsmål ble flyttet innenfor temaene.
        Fire nye temaer: tilhørighet, framkommelighet, medvirkning og korona.
      kilde: {id: rapport-2023, side: "4"}
    sammenligner_med:
      utgaver: ["2007", "2010", "2014", "2018"]
      merknad: Rapporten sier at sammenligning over tid må gjøres med varsomhet.
      kilde: {id: rapport-2023, side: "18"}

