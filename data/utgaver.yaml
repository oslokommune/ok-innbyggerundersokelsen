  - id: "2018"
    aar: 2018
    navn: Publikumsundersøkelsen
    sporreskjema: {id: rapport-2018, side: "113–119"}
    sporreskjema_merknad: >-
      Rapporten gjengir papirskjemaet. De som svarte på nett, fikk en programmert versjon med
      andre spørsmål om tjenestene (se skjemaendring).
    oppdrag:
      oppdragsgiver: Oslo kommune, Byrådsavdeling for finans
      leverandor: Kantar TNS
      kilde: {id: rapport-2018, side: "5"}
    malgruppe:
      beskrivelse: Innbyggere i Oslo, 18 år og eldre
      alder_fra: 18
      alder_til: null
      kilde: {id: rapport-2018, side: "5"}
    analyseenhet: Individual
    tidsmetode: CrossSection
    utvalgsramme:
      beskrivelse: Folkeregisteret. Skjemaet ble sendt i posten, og mobilnummer ble koblet på for påminnelse på SMS.
      kilde: {id: rapport-2018, side: "5"}
    utvalgsdesign:
      type: Probability.Stratified.Disproportional
      beskrivelse: >-
        Fordelt etter svarinngangen i 2014 for å få en jevnere fordeling av svar per bydel.
        Andelen med innvandrerbakgrunn i hver bydel skulle være den samme som i befolkningen.
        Bruttoutvalget fikk 34,7 prosent med innvandrerbakgrunn, en svak overrepresentasjon på
        1,6 prosentpoeng.
      kilde: {id: rapport-2018, side: "5–6, 8"}
    innsamling:
      beskrivelse: Papirskjema i posten, med mulighet for å svare på nett. 48 prosent svarte på nett.
      modus:
        - {kode: SelfAdministeredQuestionnaire.Paper, antall: 5130}
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 4698}
      kilde: {id: rapport-2018, side: "6"}
    kontakt:
      beskrivelse: Påminnelse på SMS 16. april og i posten 23. april.
      kilde: {id: rapport-2018, side: "5"}
    sprak:
      beskrivelse: Som i 2014. Papirskjemaet var på norsk. På nett kunne man også svare på engelsk, polsk, somali og urdu.
      kilde: {id: rapport-2018, side: "5, 9"}
    feltperiode:
      fra: 2018-03-27
      til: 2018-05-23
      beskrivelse: null
      arstid: vår
      kilde: {id: rapport-2018, side: "5"}
    svar:
      bruttoutvalg: 30001
      nettoutvalg: 9828
      svarprosent: 34
      beregning: Utsendte minus retur (flytting, feil eller ukjent adresse).
      nettoutvalg_merknad: Tabell 1.3 og 1.10 i rapporten oppgir 9 827 (s. 7, 11). Datafila har 9 829 svar.
      kilde: {id: rapport-2018, side: "6"}
    vekting:
      variabler: [kjønn, alder, bydel]
      beskrivelse: >-
        Vektet etter kjønn, alder i fire grupper og bydel. Rapporten sier at gjennomføringen
        var lik tidligere år med tanke på datainnsamlingsmetode og vekting.
      vektvariabel: {navn: NYvekt, kilde: {id: datafil, side: null}}
      kilde: {id: rapport-2018, side: "10"}
