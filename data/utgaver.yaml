      kilde: {id: rapport-2010, side: "5–6"}
    vekting:
      variabler: [kjønn, alder, bydel]
      beskrivelse: Vektet etter kjønn, alder og bydel.
      vektvariabel: {navn: VEKT, kilde: {id: datafil, side: null}}
      kilde: {id: rapport-2010, side: "9"}
    landbakgrunn:
