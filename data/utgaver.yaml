      alder_til: null
      kilde: {id: rapport-2004, side: "3"}
    analyseenhet: Individual
    tidsmetode: CrossSection
    utvalgsramme:
      beskrivelse: Folkeregisteret. Skjemaet ble sendt i posten.
      kilde: {id: rapport-2004, side: "3"}
    utvalgsdesign:
      type: Probability.Stratified.Disproportional
      beskrivelse: Like mange i hver bydel, 974 utsendelser i hver av de 15 bydelene.
      kilde: {id: rapport-2004, side: "3"}
    innsamling:
      beskrivelse: Papirskjema i posten, med mulighet for å svare på nett.
      modus:
        - {kode: SelfAdministeredQuestionnaire.Paper, antall: 6060}
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 237}
      kilde: {id: rapport-2004, side: "3"}
    kontakt:
      beskrivelse: En purring.
      kilde: {id: rapport-2004, side: "3"}
    sprak:
      beskrivelse: >-
