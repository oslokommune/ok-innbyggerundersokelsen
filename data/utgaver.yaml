        Groruddalen.
      kilde: {id: rapport-2010, side: "4, 9"}
    innsamling:
      beskrivelse: Papirskjema i posten, med mulighet for å svare på nett. Tilleggsutvalget svarte på nett i panelet.
      modus:
        - {kode: SelfAdministeredQuestionnaire.Paper, antall: 4917}
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 2090}
        - {kode: SelfAdministeredQuestionnaire.CAWI, antall: 171, merknad: panelet}
