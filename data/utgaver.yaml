# Metoden for hver utgave, i ett felles system.
#
# Feltene er de samme for alle utgaver, slik at forskjellene kan leses felt for felt.
# Hvert felt har en kilde (id i data/kilder.yaml) og en side. Står det «ikke oppgitt», er
# opplysningen ikke funnet i kilden.
#
# Koder:
#   utvalgsdesign.type  – DDI SamplingProcedure 2.0
#   innsamling.modus    – DDI ModeOfCollection 5.0, én post per modus, med antall svar
#   analyseenhet        – DDI AnalysisUnit
#   tidsmetode          – DDI TimeMethod (serien som helhet: Longitudinal.TrendRepeatedCrossSection)
#
# Svarprosentene kan ikke stilles opp som en serie. Se feltet svar.beregning og
# docs/SAMMENLIGNBARHET-OVER-TID.md.

formatversjon: 1

tidsmetode_serie: Longitudinal.TrendRepeatedCrossSection

historikk:
  - aar: 1998
    beskrivelse: >-
      Deltakerne ble rekruttert på telefon på forhånd, og svarprosenten er oppgitt til 67. Den
      er regnet av dem som sa ja på telefon.
    kilde: {id: rapport-2007, side: "3"}
  - aar: 2001
    beskrivelse: >-
      Deltakerne ble rekruttert på telefon på forhånd, og svarprosenten er oppgitt til 70.
      Regnet av alle som ble kontaktet på telefon, var svarprosenten om lag 33,3.
    kilde: {id: rapport-2007, side: "3"}

