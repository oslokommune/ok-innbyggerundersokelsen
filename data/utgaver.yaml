      type: register
      beskrivelse: Folkeregisteret.
      kilde: {id: rapport-2018, side: "9"}
    skjemaendring:
      beskrivelse: >-
        Skjemaet ble revidert, men mindre enn i 2014. Noen spørsmål gikk ut og noen kom til,
